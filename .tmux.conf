# Minimal tmux: behaves like a plain shell, Ctrl-\ detaches, nothing else.

set -g default-shell /usr/bin/zsh
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# No status bar, no bells, no titles, no key delay.
set -g status off
set -g bell-action none
set -g visual-bell off
set -g visual-activity off
set -g set-titles off
set -g escape-time 0

# Size each window to the terminal(s) currently showing it, not to every client of the session.
setw -g aggressive-resize on

# Leave the mouse to the terminal (native selection and wheel scrolling).
set -g mouse off

# Don't use the alternate screen, so output lands in the terminal's own scrollback.
set -ga terminal-overrides ",*:smcup@:rmcup@"

# Drop every key binding and the prefix key; keep only the detach key.
set -g prefix None
set -g prefix2 None
unbind -a -T prefix
unbind -a -T root
bind -n 'C-\' detach-client
